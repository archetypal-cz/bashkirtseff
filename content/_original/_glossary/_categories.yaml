# Glossary categories — the folders under content/_original/_glossary/ (updated 2026-10-23, ledger D-74).
# An entry's frontmatter `category:` is its folder path (people/aristocracy …); `type:` follows the top level
# (Person / Place / Culture). The folders are authoritative: `just glossary-move ID category` creates the path
# without checking this list, so add a line here when you open a new folder.
# (The old load_priority / auto-archive / deprecation rules were never implemented and are dropped.)

categories:
  people:
    core: "Central figures: Marie and those with hundreds of mentions"
    family: "Marie's family (Maman, Papa, Paul, Dina, ma tante, grandparents…)"
    recurring: "People who appear in many entries over a long stretch"
    mentioned: "Everyone else, including one-off and unidentified people (the default)"
    aristocracy: "Titled society — princes, counts, barons and their families"
    royalty: "Reigning or royal persons"
    politicians: "Statesmen, deputies, officials"
    artists: "Painters, sculptors, musicians, singers, actors"
    writers: "Authors, journalists, critics"
    doctors: "Physicians who treat Marie or her family"
    service: "Servants, governesses, coachmen, maids"
    religious: "God, the Virgin, Christ, saints, clergy"
    historical: "Historical figures Marie reads or thinks about"
    society: "Society figures without a better folder"

  places:
    cities: "Cities and towns"
    travel: "Towns and resorts visited on journeys"
    countries: "Countries"
    regions: "Regions, provinces, coasts"
    neighborhoods: "Quarters and districts"
    streets: "Streets, squares, boulevards, promenades"
    residences: "Where Marie and her family live or stay"
    villas: "Villas (Nice, Rome…)"
    hotels: "Hotels"
    buildings: "Public and private buildings"
    landmarks: "Monuments and sights"
    churches: "Churches, cathedrals, chapels"
    parks: "Parks and gardens"
    theaters: "Theatres and opera houses"
    venues: "Other venues — baths, rinks, markets, shooting grounds"
    social: "Clubs, cafés, restaurants, salons"
    shops: "Shops, couturiers, dealers"
    schools: "Schools, academies, ateliers as places"

  culture:
    art: "Artworks, exhibitions, ateliers, art movements (Marie's own works included)"
    literature: "Books, poems, literary works and references"
    theater: "Plays, operas, ballets, performances"
    music: "Musical works and songs"
    newspapers: "Newspapers and periodicals"
    history: "Historical events, eras, concepts"
    institutions: "Institutions and organisations"
    social_customs: "Customs and events — balls, races, carnival, feast days"
    fashion: "Clothing and fashion terms"
    daily_life: "Games, pastimes and household life"
    health: "Illness and cures"
    transport: "Carriages, trains, boats"
    languages: "Languages Marie writes or speaks"
    themes: "The theme tags (see docs/research/theme-taxonomy.md)"
