# Reviewed exceptions for `just rebuild-audit` (src/scripts/rebuild_audit.py).
#
# A finding that matches an entry is kept in the JSON, marked `accepted`, and listed in the report under
# "Accepted", not as a finding. An entry that no longer matches anything is listed as stale (remove it).
#
# Keys: carnet (string), category, then para (paragraph id or list of ids) and/or file and/or match (substring of
# the finding message) to narrow it; status = marie | false-positive | owner-default; reason; triage = the
# triage note (in content/_renumber/... or the lead's rebuild-state/triage/<letter>-*.md) that judged it.
#
# status meanings
#   marie          Marie's own text or slip, kept by policy (never fact-correct Marie)
#   false-positive the audit misreads the tome (OCR gap, garbled row, refrain aligned to another occurrence)
#   owner-default  an open owner question (OWNER-QUESTIONS.md); the default stays until the owner decides
#
# Add an entry only after checking the tome docx / scan; say what you checked in `reason`.

