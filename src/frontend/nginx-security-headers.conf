# Security headers, included from nginx.conf at server level AND in every
# `location` that sets its own add_header. nginx drops ALL inherited
# server-level add_header directives in any location that declares one, so
# setting these once at server level never reached clients (web audit
# 2026-09-25, finding #2). Installed by the Dockerfile as
# /etc/nginx/security-headers.conf.

# HTTPS-only site behind Nginx Proxy Manager; sent unconditionally. No
# includeSubDomains yet: www.bashkirtseff.org still serves a self-signed cert
# and would become unreachable (HSTS forbids clicking through).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Report-only for now: pages rely on inline <script>/<style> (theme pre-paint,
# island bootstraps) and talk to Umami (pythia.kerray.cz) and the
# auth/api/admin subdomains. Promote to an enforcing Content-Security-Policy
# once the browser console shows no violations across page types.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://pythia.kerray.cz; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://pythia.kerray.cz https://auth.bashkirtseff.org https://api.bashkirtseff.org https://admin.bashkirtseff.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
