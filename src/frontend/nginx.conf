server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust proxy headers from Docker network (Nginx Proxy Manager)
    # This ensures HTTPS is preserved when behind a reverse proxy
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Relative Location headers. nginx sits behind Nginx Proxy Manager and sees
    # $scheme=http, so its automatic directory redirect (`/cz/001` → `/cz/001/`)
    # used to emit an absolute http:// URL — a downgrade plus a second hop back
    # to https (web audit 2026-09-25, #1). Relative redirects keep the scheme.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss application/manifest+json image/svg+xml;

    # Security headers (HSTS, nosniff, frame options, referrer, report-only CSP).
    # Must be re-included in every location that has its own add_header —
    # see the comment in the included file.
    include /etc/nginx/security-headers.conf;

    # Directories without an index.html (/es/, /home/, /_astro/) are a 403
    # from the index module; to users and crawlers that reads as a permissions
    # error, so answer with the real 404 page instead.
    error_page 403 =404 /404.html;

    # Content-hashed build output — safe to cache forever.
    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files keep stable names (icons, /images/…), so they must
    # not be immutable — a replaced file would never reach returning readers.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Service worker - no cache
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA manifest (the stock mime.types has no .webmanifest entry, so it was
    # served as application/octet-stream).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Bare /glossary/<id> → canonical /original/glossary/<id> (301).
    # Replaces ~3,259 build-generated meta-refresh redirect pages with a single
    # server rule. The `(.+)` ensures this only matches an ID segment, never the
    # bare /glossary index (handled by astro.config redirects) and never the
    # real entries under /original/glossary/... or the JSON API under
    # /api/glossary/... (different path prefixes, so no overlap).
    # Redirects straight to the slash-terminated URL (one hop, not two).
    location ~ ^/glossary/(.+?)/?$ {
        return 301 /original/glossary/$1/$is_args$args;
    }

    # HTML pages - short cache
    location / {
        # A single Cache-Control header (the old `expires 1h` emitted a second one).
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        # Resolve real files / directories (Astro emits trailing-slash dirs with
        # index.html) and `.html` siblings, then 404. The previous final fallback
        # of `/index.html` turned every missing path into a soft-404 (HTTP 200
        # serving the homepage), which made robots.txt/sitemap.xml return HTML and
        # produced ~infinite duplicate pages for crawlers. With `=404` the
        # `error_page 404 /404.html` rule below serves the real 404 page instead.
        try_files $uri $uri/ $uri.html =404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
