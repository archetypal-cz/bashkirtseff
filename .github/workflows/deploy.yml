name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'src/shared/**'
      - 'content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required secrets:
#   TAILSCALE_AUTHKEY - Tailscale auth key for network access
#   HEADSCALE_URL     - Headscale login server URL
#   SSH_PRIVATE_KEY   - SSH private key for deploy user
#   DEPLOY_HOST       - Target server hostname (Tailscale name)
#   DEPLOY_USER       - SSH username on target server
#   DEPLOY_PATH       - Path to project on target server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          hostname: github-actions-deploy

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Verify key format
          head -1 ~/.ssh/id_ed25519

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # Umami analytics are public (embedded in served pages), so they live
          # as repo *variables*, not secrets. Passed into the server-side build
          # below; docker compose interpolates them into the frontend build args.
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          # Wait for Tailscale to be ready
          sleep 5

          # SSH to server and deploy.
          # Use fetch + reset --hard instead of `git pull`: a plain pull dies with
          # "insufficient permission ... unpack-objects failed" if the checkout has
          # ended up with partial/foreign-owned objects, and merge conflicts would
          # leave the tree dirty. reset --hard makes the deploy idempotent and
          # always lands exactly on origin/main.
          # The PUBLIC_UMAMI_* values expand here (on the runner) into the remote
          # command, where they become build-arg env for `docker compose`.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_PATH} && \
             git fetch origin main && \
             git reset --hard origin/main && \
             cd src/frontend && \
             PUBLIC_UMAMI_URL='${PUBLIC_UMAMI_URL}' \
             PUBLIC_UMAMI_WEBSITE_ID='${PUBLIC_UMAMI_WEBSITE_ID}' \
             docker compose up -d --build"

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Poll for the container to come up. `docker compose up --build` in the
          # previous step can take well over 10s on a cold image cache, so a fixed
          # `sleep 10` raced the rebuild and a one-shot `docker ps | grep` failed
          # (exit 1) even though the deploy itself succeeded. Retry instead.
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 "${DEPLOY_USER}@${DEPLOY_HOST}" \
                 "docker ps --filter name=bashkirtseff-app --filter status=running --format '{{.Names}}' | grep -q bashkirtseff-app"; then
              echo "Container bashkirtseff-app is running (after $((i*5))s)"
              exit 0
            fi
            echo "Waiting for container to start... ($i/30)"
            sleep 5
          done
          echo "::error::Container bashkirtseff-app did not come up within 150s"
          exit 1
